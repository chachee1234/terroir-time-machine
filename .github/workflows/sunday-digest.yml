# Workflow E (GOVERNANCE.md §5, §10): weekly digest after the audit. Tier 0 only, no model calls.
# Posted as an issue labeled `digest` and assigned to the owner (GitHub emails the assignee).
name: Sunday digest

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  digest:
    if: vars.AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install validation dependency
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ensure_labels.sh

      - name: Run tests
        id: tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' > "$RUNNER_TEMP/tests.txt" 2>&1 || true
          echo "summary=$(python3 scripts/summarize_tests.py < "$RUNNER_TEMP/tests.txt")" >> "$GITHUB_OUTPUT"

      - name: Build and post digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TESTS: ${{ steps.tests.outputs.summary }}
        run: |
          gh issue list --repo "$REPO" --state all --limit 500 \
            --json number,title,state,labels,closedAt,comments \
            | python3 scripts/digest.py --tests "$TESTS" > "$RUNNER_TEMP/digest.md"
          for old in $(gh issue list --repo "$REPO" --label digest --state open --json number --jq '.[].number'); do
            gh issue close "$old" --repo "$REPO" --comment "Superseded by this week's digest."
          done
          gh issue create --repo "$REPO" --title "Weekly Digest — $(date -u +%F)" --label digest \
            --assignee "$OWNER" --body-file "$RUNNER_TEMP/digest.md"
