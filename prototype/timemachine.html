<meta charset="utf-8">
<title>Terroir Time Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#0b0e10; --panel:rgba(12,15,17,.78); --panel-solid:#12171a; --line:rgba(232,226,214,.14);
  --ink:#ece6d9; --muted:#a39d91; --magma:#ff7a2f; --magma-ink:#1a0d05; --ochre:#d2a867;
  --recon:#9fb7ff; --illus:#f0b95a; --approx:#7fd1a8;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#16202a 0%,#07090b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(250,248,244,.98) 0%,rgba(236,236,236,.92) 45%,rgba(200,208,214,.75) 100%)}
.ui{position:absolute;z-index:2}
.top{top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{font-family:var(--serif);font-size:20px;line-height:1.1;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c,var(--muted))}
.readout{position:absolute;z-index:2;left:16px;top:calc(76px + env(safe-area-inset-top,0px));pointer-events:none}
.age{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(34px,7vw,64px);font-weight:500;line-height:1;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.55)}
.age span{font-size:.42em;color:var(--muted);margin-left:.25em;letter-spacing:0}
.era{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.card{position:absolute;z-index:2;left:16px;bottom:calc(118px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .5s ease,transform .5s ease}
.card.swap{opacity:0;transform:translateY(6px)}
.card .eyebrow{font-family:var(--mono);font-size:12px;color:var(--ochre);letter-spacing:.04em}
.card h2{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.card p{margin:0;color:#d7d1c4;font-size:14.5px;max-width:62ch}
.card .cls{margin-top:10px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card .cls b{color:var(--c);font-weight:600}
.pin{position:absolute;z-index:2;transform:translate(-50%,-100%);pointer-events:none;font-size:12px;white-space:nowrap;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.pin b{display:block;font-family:var(--serif);font-weight:400;font-size:14px}
.pin::after{content:"";display:block;width:1px;height:18px;margin:3px auto 0;background:var(--ink);opacity:.7}
.bar{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(8,10,12,.92),rgba(8,10,12,.72) 70%,rgba(8,10,12,0));}
.row{display:flex;align-items:center;gap:8px}
.btn{font:500 14px var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;min-height:40px;min-width:40px;padding:0 12px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.play{background:var(--magma);color:var(--magma-ink);border-color:var(--magma);font-weight:600;min-width:84px}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--magma);outline-offset:2px}
.track{position:relative;flex:1;height:52px;min-width:0}
.ticks{position:absolute;left:0;right:0;top:0;height:22px}
.tick{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 2px;color:var(--muted);font:11px var(--mono);cursor:pointer;white-space:nowrap}
.tick::after{content:"";display:block;width:1px;height:7px;background:currentColor;margin:2px auto 0}
.tick.on{color:var(--magma)}
.tick.minor span{display:none}
.tick:focus-visible{outline:2px solid var(--magma)}
#scrub{position:absolute;left:0;right:0;bottom:4px;width:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;height:24px;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#3b4a63 0%,#2d5d6e 26%,#6b5a43 46%,#8a4a2a 60%,#c0622a 70%,#5f7a45 100%)}
#scrub::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#3b4a63 0%,#2d5d6e 26%,#6b5a43 46%,#8a4a2a 60%,#c0622a 70%,#5f7a45 100%)}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--magma);margin-top:-6px}
#scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid var(--magma)}
.scale{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:2px}
.note{font-size:11.5px;color:var(--muted)}
#speed{min-width:52px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:5}
@media (max-width:640px){
  .brand{font-size:17px}
  .card{bottom:calc(128px + env(safe-area-inset-bottom,0px));padding:12px 14px}
  .card h2{font-size:19px}
  .card p{font-size:13.5px}
  .tick span{display:none}
  .tick.on span{display:inline}
  .hide-sm{display:none}
}
@media (max-height:560px){ .card p{display:none} }
</style>

<div id="stage">
  <canvas id="gl" aria-label="Animated 3D view of Earth and Mount St. Helena through geological time"></canvas>
  <div id="veil"></div>
</div>

<div class="ui top">
  <div class="brand">Terroir Time Machine<small>Mount St. Helena · Napa &amp; Sonoma, California</small></div>
  <div class="chips">
    <span class="chip" id="scaleChip">Planet</span>
    <span class="chip" id="clsChip"><i></i><span>Reconstruction</span></span>
  </div>
</div>

<div class="readout" aria-live="off">
  <div class="age" id="age">1.80<span>Ga</span></div>
  <div class="era" id="era">Paleoproterozoic</div>
</div>

<div class="pin" id="pin" hidden><b id="pinT">Mount St. Helena</b><span id="pinS"></span></div>

<article class="card" id="card" aria-live="polite">
  <div class="eyebrow" id="cEye"></div>
  <h2 id="cTitle"></h2>
  <p id="cBody"></p>
  <div class="cls" id="cCls"></div>
</article>

<div class="bar">
  <div class="row">
    <button class="btn" id="prev" aria-label="Previous chapter">◀</button>
    <button class="btn play" id="play" aria-pressed="false">Play</button>
    <button class="btn" id="next" aria-label="Next chapter">▶</button>
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <input type="range" id="scrub" min="0" max="1" step="any" value="0" aria-label="Time">
    </div>
    <button class="btn hide-sm" id="speed" aria-label="Playback speed">1×</button>
  </div>
  <div class="scale"><span>1.8 billion years ago</span><span class="note hide-sm">Time axis is logarithmic · artistic reconstruction, simplified geography</span><span>Today</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
if(!window.THREE){ document.body.insertAdjacentHTML("beforeend",'<div class="err">The 3D engine could not load. Check your connection and reload.</div>'); return; }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------------ time axis
   Log axis: position p in [0,1], 0 = 1.8 Ga, 1 = today. K sets how much room
   the recent past gets. */
const MAXA = 1800, K = 5, L = Math.log10(1 + MAXA*K);
const pOf = a => 1 - Math.log10(1 + Math.max(0,a)*K)/L;
const ageOf = p => (Math.pow(10,(1-p)*L) - 1)/K;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const sm = (e0,e1,x)=>{ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }; // works with e0>e1 too
const lerp = (a,b,t)=>a+(b-a)*t;
function band(a,older,younger,soft){ return sm(older+soft,older,a)*sm(younger-soft,younger,a); }

function fmtAge(a){
  if(a>=1000) return [(a/1000).toFixed(2),"Ga"];
  if(a>=100) return [a.toFixed(0),"Ma"];
  if(a>=10) return [a.toFixed(1),"Ma"];
  if(a>=1) return [a.toFixed(2),"Ma"];
  if(a>=0.001) return [(a*1000).toFixed(0),"ka"];
  return ["Today",""];
}
function eraName(a){
  const E=[[1600,"Paleoproterozoic"],[1000,"Mesoproterozoic"],[538.8,"Neoproterozoic"],[251.9,"Paleozoic"],[66,"Mesozoic"],[23,"Paleogene"],[2.58,"Neogene"],[0.0117,"Quaternary · Pleistocene"],[-1,"Quaternary · Holocene"]];
  for(const [lim,n] of E) if(a>lim) return n;
  return "Holocene";
}

/* ------------------------------------------------------------------ chapters */
const CLS = {
  recon:{name:"Reconstruction · stylized", c:"var(--recon)"},
  illus:{name:"Illustration · process shown, shape invented", c:"var(--illus)"},
  approx:{name:"Terrain · approximate modern shape", c:"var(--approx)"}
};
const CH = [
 {age:1800, key:1, tag:"1.8 Ga", t:"Columbia: the old heart of North America", cls:"recon",
  b:"Mount St. Helena is nearly two billion years in the future. The ancient core of North America, called Laurentia, is being stitched together inside an early supercontinent. The glow marks Laurentia, the continent this story will eventually be written on."},
 {age:1100, tag:"1.1 Ga", t:"Rodinia assembles", cls:"recon",
  b:"Continents collide into a new supercontinent, Rodinia. Land is bare rock and dust. There are no plants, and life is still microscopic and lives in the sea."},
 {age:700, key:1, tag:"700 Ma", t:"Snowball Earth, and a coastline is born", cls:"recon",
  b:"Ice may have reached the equator. Meanwhile Rodinia tears apart, and the tear becomes the western edge of Laurentia. California will eventually be built against this edge, piece by piece, from material the ocean delivers."},
 {age:430, tag:"430 Ma", t:"Life reaches land", cls:"recon",
  b:"The first plants spread across the continents and turn them green. Off western North America, the coast is a quiet edge facing open ocean."},
 {age:250, key:1, tag:"250 Ma", t:"Pangaea, and the long subduction begins", cls:"recon",
  b:"Every major continent is joined. Off the west coast an ocean plate begins sinking beneath the continent. That subduction zone will run for about 200 million years and build much of California."},
 {age:150, key:1, tag:"150 Ma", t:"Zoom in: this spot is deep ocean", cls:"illus", scale:"local",
  b:"We drop to the 30 km block that will one day hold Mount St. Helena. It is seafloor. The Farallon plate slides east into a deep trench, and mud, sand and slices of ocean crust are scraped off and piled up. That pile becomes the Franciscan Complex and Coast Range ophiolite beneath the Mayacamas."},
 {age:66, tag:"66 Ma", t:"A distant impact darkens the sky", cls:"illus",
  b:"An asteroid strikes what is now Mexico. The dust dims sunlight worldwide and ends the age of dinosaurs. Here, the scraped-up seafloor keeps accumulating under the waves."},
 {age:28, key:1, tag:"28 Ma", t:"The San Andreas system is born", cls:"illus",
  b:"The spreading ridge between the Pacific and Farallon plates reaches the trench. Subduction shuts off piece by piece and a sliding boundary, the San Andreas system, takes over. The pile of old seafloor starts rising out of the sea."},
 {age:8, key:1, tag:"8 Ma", t:"The Sonoma Volcanics begin", cls:"illus",
  b:"A gap opens in the sinking plate and hot mantle rises through it. Volcanoes erupt across what is now Sonoma and Napa for about five million years, generally younger toward the north."},
 {age:3.0, span:[3.45,2.95], tag:"≈3.0 Ma", t:"The Mount St. Helena volcano", cls:"illus",
  b:"Thick rhyolite lava builds the summit area, dated to about 3 million years ago. The volcanic center swells into the highest point for miles. Its true height and shape at this moment are unknown; this peak is an artist's version."},
 {age:2.85, key:1, span:[2.93,2.83], tag:"≈2.85 Ma", t:"Caldera eruption", cls:"illus",
  b:"An enormous explosive eruption empties the magma chamber. Hot ash flows race across the land and weld into rock, and the volcano's top collapses into a caldera. The welded tuff at today's summit comes from eruptions like this one."},
 {age:1.0, tag:"1 Ma", t:"Uplift and erosion", cls:"illus",
  b:"Faults keep squeezing and lifting the Mayacamas while rain and streams tear the old volcano down. The caldera shape is almost erased. The hard welded tuff resists erosion and is left standing high."},
 {age:0, key:1, tag:"Today", t:"Mount St. Helena today", cls:"approx",
  b:"The peak rises about 1,320 m above Knights Valley and the head of Napa Valley. Volcanic soils on its flanks and river-laid gravels on the valley floors are part of the terroir of the vineyards below."}
];
CH.forEach(c=>{ c.trig = c.span ? c.span[0] : c.age; c.p = pOf(c.trig); });
const P_SWITCH = pOf(180);

/* ------------------------------------------------------------------ renderer */
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true}); }
catch(e){ document.body.insertAdjacentHTML("beforeend",'<div class="err">WebGL is not available in this browser, so the 3D view cannot run.</div>'); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);

const GLSL_NOISE = `
float hash(vec3 p){ p = fract(p*0.3183099+0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=0.5; } return s; }
`;

/* =================================================================== GLOBE */
const gScene = new THREE.Scene();
const gCam = new THREE.PerspectiveCamera(38,1,0.01,100);
const gCtl = new THREE.OrbitControls(gCam, canvas);
gCtl.enablePan=false; gCtl.minDistance=1.3; gCtl.maxDistance=6; gCtl.enableDamping=true;

// Continent "blobs": [age Ma, lat, lon] keyframes, oldest first. Hand-built, loosely
// following published supercontinent cycles (Columbia, Rodinia, Pangaea). Stylized.
const PLATES = [
 {n:"Laurentia", r:.42, k:[[1800,10,-20],[1100,-5,-10],[750,0,-20],[540,-5,-60],[400,0,-40],[250,20,-25],[180,30,-40],[100,40,-70],[50,45,-90],[0,48,-100]]},
 {n:"Baltica",   r:.30, k:[[1800,22,12],[1100,-20,22],[750,-30,20],[540,-40,10],[400,-10,0],[250,38,10],[180,42,10],[100,46,15],[0,52,22]]},
 {n:"Siberia",   r:.50, k:[[1800,42,-2],[1100,12,32],[750,16,42],[540,20,80],[400,30,60],[250,55,60],[180,55,72],[100,55,86],[0,55,95]]},
 {n:"Amazonia",  r:.36, k:[[1800,-22,-32],[1100,-25,-5],[750,-35,-40],[540,-40,-30],[400,-40,-20],[250,-20,-25],[180,-15,-30],[100,-15,-40],[50,-15,-55],[0,-15,-60]]},
 {n:"Africa",    r:.42, k:[[1800,-40,12],[1100,-40,22],[750,-50,0],[540,-50,0],[400,-45,5],[250,-10,10],[180,-5,10],[100,0,15],[0,5,20]]},
 {n:"Australia", r:.26, k:[[1800,25,40],[1100,20,-35],[750,25,-45],[540,-10,90],[400,-20,100],[250,-45,70],[180,-50,80],[100,-55,100],[50,-45,120],[0,-25,135]]},
 {n:"Antarctica",r:.32, k:[[1800,5,50],[1100,15,-50],[750,20,-60],[540,-30,80],[400,-50,60],[250,-60,50],[180,-65,50],[100,-75,60],[0,-85,0]]},
 {n:"India",     r:.17, k:[[1800,-5,62],[1100,35,-30],[750,-15,60],[540,-20,60],[400,-30,50],[250,-35,45],[180,-35,50],[100,-20,60],[50,5,72],[0,20,78]]}
];
const D2R = Math.PI/180;
function ll2v(lat,lon,out){ lat*=D2R; lon*=D2R; return (out||new THREE.Vector3()).set(Math.cos(lat)*Math.cos(lon), Math.sin(lat), -Math.cos(lat)*Math.sin(lon)); }
function plateAt(pl,a,out){
  const k=pl.k; let i=0; while(i<k.length-2 && a<k[i+1][0]) i++;
  const A=k[i], B=k[i+1]; const t=sm(0,1,clamp((A[0]-a)/(A[0]-B[0]),0,1));
  let dl=((B[2]-A[2]+540)%360)-180;
  return ll2v(lerp(A[1],B[1],t), A[2]+dl*t, out);
}

const gUni = {
  uC:{value:PLATES.map(()=>new THREE.Vector3())}, uR:{value:PLATES.map(p=>p.r)},
  uGreen:{value:0}, uCap:{value:1}, uIceAll:{value:0}, uDesert:{value:0}, uSun:{value:new THREE.Vector3(1,0,0)}, uTime:{value:0}
};
const globeMat = new THREE.ShaderMaterial({
  uniforms:gUni,
  vertexShader:`varying vec3 vN; void main(){ vN=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:GLSL_NOISE+`
  uniform vec3 uC[8]; uniform float uR[8]; uniform float uGreen,uCap,uIceAll,uDesert; uniform vec3 uSun;
  varying vec3 vN;
  float smax(float a,float b,float k){ float h=clamp(0.5+0.5*(a-b)/k,0.0,1.0); return mix(b,a,h)+k*h*(1.0-h); }
  void main(){
    vec3 n=normalize(vN);
    float f=-1.0;
    for(int i=0;i<8;i++){ f=smax(f, uR[i]-acos(clamp(dot(n,uC[i]),-1.0,1.0)), 0.09); }
    float e=f+(fbm(n*3.1)-0.5)*0.24+(fbm(n*11.0)-0.5)*0.07;
    float land=smoothstep(0.0,0.012,e);
    vec3 deep=vec3(0.02,0.07,0.18), shallow=vec3(0.06,0.30,0.42);
    vec3 ocean=mix(deep,shallow,smoothstep(-0.14,0.0,e));
    float v=fbm(n*6.0);
    vec3 barren=mix(vec3(0.52,0.37,0.27),vec3(0.72,0.58,0.42),v);
    vec3 green=mix(vec3(0.20,0.33,0.17),vec3(0.44,0.43,0.25),fbm(n*5.0+3.0));
    vec3 lc=mix(barren,green,uGreen);
    lc=mix(lc,vec3(0.76,0.62,0.42),uDesert*smoothstep(0.12,0.3,e));
    lc=mix(lc,lc*0.72+vec3(0.08),smoothstep(0.02,0.0,abs(e-0.2))*0.5); // interior ranges
    vec3 col=mix(ocean,lc,land);
    float ice=max(uIceAll*smoothstep(0.3,0.6,fbm(n*4.0)+0.25), smoothstep(uCap-0.04,uCap+0.01,abs(n.y)));
    col=mix(col,vec3(0.93,0.96,1.0),clamp(ice,0.0,1.0));
    vec3 V=normalize(cameraPosition-n);
    float diff=clamp(dot(n,uSun),0.0,1.0);
    float spec=pow(max(dot(reflect(-uSun,n),V),0.0),48.0)*(1.0-land)*(1.0-ice)*0.6;
    col=col*(0.08+1.0*diff)+vec3(1.0,0.95,0.85)*spec;
    gl_FragColor=vec4(col,1.0);
  }`
});
const globe = new THREE.Mesh(new THREE.SphereGeometry(1,160,120), globeMat);
gScene.add(globe);

const cloudMat = new THREE.ShaderMaterial({
  uniforms:{uTime:gUni.uTime, uSun:gUni.uSun, uAmt:{value:1}}, transparent:true, depthWrite:false,
  vertexShader:`varying vec3 vN; void main(){ vN=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:GLSL_NOISE+`uniform float uTime,uAmt; uniform vec3 uSun; varying vec3 vN;
  void main(){ vec3 n=normalize(vN); float c=fbm(n*3.5+vec3(uTime*0.02,0.0,uTime*0.013));
    float a=smoothstep(0.52,0.72,c)*0.75*uAmt; float d=clamp(dot(n,uSun),0.0,1.0);
    gl_FragColor=vec4(vec3(0.97)*(0.1+0.95*d),a); }`
});
gScene.add(new THREE.Mesh(new THREE.SphereGeometry(1.012,96,72), cloudMat));

const atmoMat = new THREE.ShaderMaterial({
  uniforms:{uSun:gUni.uSun}, side:THREE.BackSide, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  vertexShader:`varying vec3 vVN; varying vec3 vW; void main(){ vVN=normalize(normalMatrix*normal); vW=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 uSun; varying vec3 vVN; varying vec3 vW;

// seeded value noise for terrain synthesis
function mkNoise(seed){
  const perm=new Uint8Array(512), vals=new Float32Array(256); let s=seed>>>0;
  const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  for(let i=0;i<256;i++){ perm[i]=i; vals[i]=rnd(); }
  for(let i=255;i>0;i--){ const j=(rnd()*(i+1))|0; [perm[i],perm[j]]=[perm[j],perm[i]]; }
  for(let i=0;i<256;i++) perm[i+256]=perm[i];
  const v=(x,y)=>vals[perm[(x&255)+perm[y&255]]];
  function n2(x,y){ const xi=Math.floor(x), yi=Math.floor(y); let xf=x-xi, yf=y-yi; xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf);
    const a=v(xi,yi),b=v(xi+1,yi),c=v(xi,yi+1),d=v(xi+1,yi+1); return lerp(lerp(a,b,xf),lerp(c,d,xf),yf); }
  return {
    fbm(x,y,o=5){ let a=.5,s=0; for(let i=0;i<o;i++){ s+=a*n2(x,y); x=x*2.03+17.1; y=y*2.03+9.7; a*=.5; } return s; },
    ridged(x,y,o=5){ let a=.5,s=0; for(let i=0;i<o;i++){ const r=1-Math.abs(n2(x,y)*2-1); s+=a*r*r; x=x*2.1+5.3; y=y*2.1+1.9; a*=.5; } return s; }
  };
}

function stages(x,z){
  const n=-z, r=Math.hypot(x,z);
  const c = 0.766*x + 0.643*n, al = -0.643*x + 0.766*n;           // across / along the N40W Mayacamas trend
  const ridge = 0.62*Math.exp(-((c/4.5)**2))*(0.78+0.22*Math.cos(al*0.27));
  const hills = 0.34*Math.exp(-(((c+11)/4)**2)) + 0.30*Math.exp(-(((c-12.5)/4)**2));
  const peak = 0.64*Math.exp(-((r/2.6)**2));
  const f1 = nz.fbm(x*.18+40,z*.18+40), f2 = nz.fbm(x*.5,z*.5);
  const rd = nz.ridged(x*.23+3,z*.23+7);
  // S5 modern (approximate): ridge + summit + eroded gullies, flat alluvial valley floors
  let m = 0.10 + ridge + hills + peak + (rd-0.35)*0.30*(0.25+ridge+peak+hills) + (f2-0.5)*0.08;
  const floor = 0.06 + 0.03*f1; m = m < floor+0.08 ? floor + Math.max(0,m-floor)**2/0.16*0.08 : m;
  // S0 seafloor with trench deepening west
  const s0 = -2.25 + 0.022*c + 0.16*(f1-0.5) + 0.05*Math.sin(al*1.3+f2*4);
  // S1 accretionary wedge: low islands, land rising to the east
  const s1 = -0.28 + 0.028*c + 0.55*(f1-0.45) + 0.12*(rd-0.4);
  // S2 uplifted Coast Range hills before volcanism
  const s2 = 0.16 + 0.48*(ridge+hills) + 0.12*(f1-0.5) + 0.08*(rd-0.4);
  // S3 volcanic field + summit volcano
  const cone = 1.55*Math.exp(-Math.pow(r/3.3,1.35));
  const s3 = s2 + 0.18*Math.exp(-((r/11)**2)) + cone + 0.22*(nz.fbm(x*.32+9,z*.32+2)-0.4)*Math.exp(-((r/8)**2)) + 0.14*Math.exp(-((r/0.9)**2));

}

const w6 = new Float32Array(6);
function localWeights(a){
  w6.fill(0);
  if(a>=LSTAGE_A[0]){ w6[0]=1; return w6; }
  for(let i=0;i<LSTAGE_A.length-1;i++){
    if(a<=LSTAGE_A[i] && a>=LSTAGE_A[i+1]){
      let t=(LSTAGE_A[i]-a)/(LSTAGE_A[i]-LSTAGE_A[i+1]);
      t = i===1 ? Math.pow(t,0.8) : t*t*(3-2*t);
      w6[LSTAGE_S[i]]+=1-t; w6[LSTAGE_S[i+1]]+=t; return w6;
    }
  }
  w6[5]=1; return w6;
}

  const w=localWeights(a);
  lUni.uWa.value.set(w[0],w[1],w[2]); lUni.uWb.value.set(w[3],w[4],w[5]);
  lUni.uVolc.value = a>1 ? sm(8,3.2,a) : lerp(0.55,1,sm(0,1,a));
  const dome=band(a,3.45,2.95,0.08), big=band(a,2.905,2.845,0.012);
  lUni.uLava.value = Math.max(dome*0.55, big);
  ash.material.uniforms.uE.value = Math.max(dome*0.3, big);
  lUni.uAsh.value = a<2.86 ? sm(2.2,2.86,a) : big*0.6;
  lUni.uVines.value = sm(0.06,0,a);
  lUni.uGold.value = sm(1.5,0,a);
  waterMat.uniforms.uAmt.value = sm(2,8,a);
  let hc=0; for(let k=0;k<6;k++) hc+=w[k]*H[k][CENTER];
  ash.material.uniforms.uTop.value = hc*VE;
  const bg = local ? setSky(a) : "radial-gradient(ellipse at 50% 42%, #142033 0%, #070a0f 72%)";
  if(bg!==lastBg){ $("stage").style.background=bg; lastBg=bg; }
  // veil for the dive through the clouds
  const vd=Math.abs(p-P_SWITCH); $("veil").style.opacity = Math.pow(clamp(1-vd/0.012,0,1),0.8).toFixed(3);
  return {local, hc};
}

/* =================================================================== cameras */
let autoCam=true;
[gCtl,lCtl].forEach(c=>c.addEventListener("start",()=>{ autoCam=false; }));
const tv=new THREE.Vector3(), up=new THREE.Vector3(0,1,0);
function driveGlobeCam(a,p,dt){
  const zoom = sm(330,186,a);                          // 0 far, 1 close
  const dist = lerp(3.4,1.42,zoom);
  const east = new THREE.Vector3().crossVectors(up,markerDir).normalize();
  tv.copy(markerDir).addScaledVector(east, lerp(0.55,0.1,zoom)).addScaledVector(up, lerp(0.35,0.05,zoom)).normalize().multiplyScalar(dist);
  gCam.position.lerp(tv, 1-Math.exp(-dt*3));
  gCtl.target.set(0,0,0); gCam.lookAt(0,0,0);
}
let orbit=0.9, lInit=false;
function driveLocalCam(a,hc,dt){
  if(!reduce) orbit += dt*0.045*(playing?1:0.6);
  const t=sm(170,0,a);
  if(!lInit){ lInit=true; lCam.position.set(Math.sin(orbit)*30,34,Math.cos(orbit)*30); }
  const dist=lerp(48,27,t), elev=lerp(0.78,0.36,t);
  tv.set(Math.sin(orbit)*Math.cos(elev)*dist, Math.sin(elev)*dist + hc*0.4, Math.cos(orbit)*Math.cos(elev)*dist);
  lCam.position.lerp(tv, 1-Math.exp(-dt*2.2));
  lCtl.target.lerp(tv.set(0, Math.max(0.3,hc*VE*0.45), 0), 1-Math.exp(-dt*2.2));
  lCam.lookAt(lCtl.target);
}

/* =================================================================== UI + playback */
let p=0, playing=false, speed=1, dwell=null, tween=null, ageOverride=null;
const DUR=110; // seconds for a full 1x run, excluding chapter holds
const scrub=$("scrub");
function chapterIndex(pp){ let k=0; for(let i=0;i<CH.length;i++) if(CH[i].p<=pp+1e-6) k=i; return k; }

$("ticks").innerHTML = CH.map((c,i)=>`<button class="tick${c.key?" key":" minor"}" data-i="${i}" style="left:${(c.p*100).toFixed(2)}%" aria-label="Jump to ${c.tag}: ${c.t}"><span>${c.tag}</span></button>`).join("");
$("ticks").addEventListener("click",e=>{ const b=e.target.closest(".tick"); if(b) goTo(+b.dataset.i); });

function showCard(i){
  if(i===lastCh) return; lastCh=i; const c=CH[i], card=$("card");
  card.classList.add("swap");
  setTimeout(()=>{
    $("cEye").textContent=c.tag; $("cTitle").textContent=c.t; $("cBody").textContent=c.b;
    const k=CLS[c.cls]; $("cCls").innerHTML=`<b style="--c:${k.c}">■</b> ${k.name}`;
    const chip=$("clsChip"); chip.style.setProperty("--c",k.c); chip.lastElementChild.textContent=k.name.split(" · ")[0];
    card.classList.remove("swap");
  }, reduce?0:220);
  document.querySelectorAll(".tick").forEach((t,j)=>t.classList.toggle("on",j===i));
}
function setPlaying(on){ playing=on; $("play").textContent=on?"Pause":(p>=1?"Replay":"Play"); $("play").setAttribute("aria-pressed",on); if(on) autoCam=true; }
$("play").onclick=()=>{ if(!playing && p>=0.9999){ p=0; lastCh=-1; } setPlaying(!playing); };
$("speed").onclick=()=>{ speed = speed===1?2:speed===2?4:1; $("speed").textContent=speed+"×"; };
function goTo(i){ i=clamp(i,0,CH.length-1); dwell=null; ageOverride=null; autoCam=true; tween={from:p,to:CH[i].p,t:0,ch:i}; }
$("prev").onclick=()=>{ const ci=dwell?dwell.i:chapterIndex(p); goTo(ci - (p-CH[ci].p<0.002 ? 1 : 0)); };
$("next").onclick=()=>goTo(chapterIndex(p)+1);
scrub.addEventListener("input",()=>{ p=+scrub.value; dwell=null; tween=null; ageOverride=null; setPlaying(false); });
addEventListener("keydown",e=>{
  if(e.target===scrub && (e.key==="ArrowLeft"||e.key==="ArrowRight")) return;
  if(e.key===" "){ e.preventDefault(); $("play").click(); }
  else if(e.key==="ArrowRight") $("next").click();
  else if(e.key==="ArrowLeft") $("prev").click();
});
function startDwell(i){ const c=CH[i]; dwell={i, t:0, dur:(c.span?7:3.2)/(reduce?1:1)}; }

function resize(){
  const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false);
  [gCam,lCam].forEach(c=>{ c.aspect=w/h; c.fov = w<h ? 55 : 40; c.updateProjectionMatrix(); });
  ash.material.uniforms.uScale.value = h*0.9;
}
addEventListener("resize",resize); resize();

const pin=$("pin"), pv=new THREE.Vector3();
let last=performance.now(), T=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  gUni.uTime.value=T; lUni.uTime.value=T;

  if(tween){
    tween.t+=dt/1.4; const k=sm(0,1,tween.t); p=lerp(tween.from,tween.to,k);
    if(tween.t>=1){ p=tween.to; const i=tween.ch; tween=null; startDwell(i); }
  } else if(dwell){
    dwell.t+=dt; const c=CH[dwell.i];
    if(c.span){ ageOverride = lerp(c.span[0], c.span[1], sm(0,1,dwell.t/dwell.dur)); }
    if(dwell.t>=dwell.dur){ if(c.span){ p=pOf(c.span[1]); ageOverride=null; } dwell=null; if(!playing) {} }
  } else if(playing){
    const np=Math.min(1,p+dt*speed/DUR);
    const hit=CH.findIndex(c=>c.p>p+1e-7 && c.p<=np);
    if(hit>=0){ p=CH[hit].p; startDwell(hit); } else p=np;
    if(p>=1 && !dwell){ setPlaying(false); }
  }
  const a = ageOverride!==null ? ageOverride : ageOf(p);
  scrub.value=p; scrub.setAttribute("aria-valuetext", fmtAge(a).join(" ")+" ago");
  const [num,unit]=fmtAge(a); $("age").innerHTML = unit ? `${num}<span>${unit}</span>` : num;
  $("era").textContent = eraName(a);
  showCard(dwell?dwell.i:chapterIndex(p));

  const st=apply(a,p);
  $("scaleChip").textContent = st.local ? "30 km block · North Bay" : (a>320 ? "Planet" : "Western North America");
  let cam;
  if(!st.local){
    if(autoCam) driveGlobeCam(a,p,dt); else gCtl.update();
    lCtl.enabled=false; gCtl.enabled=true; cam=gCam;
    renderer.render(gScene,gCam);
    pv.copy(marker.position).project(gCam);
    const facing = marker.position.dot(tv.copy(gCam.position).normalize())>0.2;
    pin.hidden=!facing;
    $("pinT").textContent = a>700 ? "Laurentia" : a>250 ? "Western edge of Laurentia" : "Future California margin";
    $("pinS").textContent = "ancestral region, not a point";
  } else {
    if(autoCam) driveLocalCam(a,st.hc,dt); else lCtl.update();
    gCtl.enabled=false; lCtl.enabled=true; cam=lCam;
    renderer.render(lScene,lCam);
    pv.set(0,st.hc*VE+0.35,0).project(lCam);
    pin.hidden = pv.z>1;
    const today=a<0.06;
    $("pinT").textContent = today ? "Mount St. Helena" : a<3.5 ? "Mount St. Helena volcanic center" : "Future site of Mount St. Helena";
    $("pinS").textContent = today ? (realDEM?"USGS 3DEP terrain":"approximate terrain") + " · 1,323 m" : "";
  }
  if(!pin.hidden){ pin.style.left=((pv.x+1)/2*innerWidth)+"px"; pin.style.top=((1-pv.y)/2*innerHeight-6)+"px"; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
